name: openhand
description: "OpenHand desktop app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_selector: ^1.1.0
  characters: ^1.4.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image: ^4.9.2
  uuid: ^4.6.0
  yaml: ^3.1.4
  xml: ^7.0.1
  highlight: ^0.7.0
  markdown: ^7.3.1
  flutter_widget_from_html_core: ^0.17.3
  sqflite_common_ffi: ^2.4.2+1
  sqflite_common: ^2.5.11
  webview_flutter: ^4.14.1
  flutter_inappwebview: ^6.1.5
  pasteboard: ^0.5.0
  crypto: ^3.0.7
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  web_socket_channel: ^3.0.3
  record: ^7.1.1

  intl: any
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # 上游 1.0.12 强制固定 Strut 高度，会让中文回退字形与混合样式上下重叠。
  flutter_markdown_plus:
    path: vendor/flutter_markdown_plus
  # 本地 xterm 修复：宽字符位于行尾时，阻止终端回流越过底层行缓冲区复制。
  xterm:
    path: vendor/xterm

flutter:
  config:
    # 现有 macOS 原生插件尚未全部支持 SwiftPM，统一使用 CocoaPods。
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/prompts/_shared/identity.md
    - assets/prompts/_shared/refusal.md
    - assets/prompts/_shared/tone.md
    - assets/prompts/_shared/workflow.md
    - assets/prompts/_shared/output_format_gpt_chat_rules.md
    - assets/prompts/_shared/output_format_html_balanced.md
    - assets/prompts/_shared/output_format_html_rich.md
    - assets/prompts/_shared/output_format_html_vivid.md
    - assets/prompts/_shared/output_format_plaintext.md
    - assets/prompts/common/
    - assets/prompts/default/
    - assets/prompts/harness_engineering/
    - assets/prompts/hermes_talker/
    - assets/prompts/machine_expert/
    - assets/prompts/programming_expert/
    - assets/prompts/programming_expert/sections/
    - assets/prompts/siri_helper/
    - assets/prompts/web_reverse_expert/
    - assets/prompts/web_reverse_expert/snippets/
    - assets/prompts/android_reverse_expert/
    - assets/prompts/android_reverse_expert/snippets/
    - assets/branding/
    - assets/icons/plugins/
    - assets/ai_jungler/
    - assets/ai_jungler/darwin-arm64/
    - assets/ai_jungler/darwin-x64/
    - assets/ai_jungler/windows-arm64/
    - assets/ai_jungler/windows-x64/
    - assets/ai_jungler/linux-arm64/
    - assets/ai_jungler/linux-x64/
    - assets/web/
    - assets/web/chunks/
    - assets/web/assets/
    - assets/tooling/

# macOS 使用系统 SQLite，避免从 GitHub 下载二进制文件。
hooks:
  user_defines:
    sqlite3:
      source: system
