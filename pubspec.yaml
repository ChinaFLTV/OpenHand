name: openhand
description: "OpenHand desktop app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  file_selector: ^1.0.3
  characters: ^1.4.1
  package_info_plus: ^10.0.0
  path: ^1.9.1
  path_provider: ^2.1.4
  provider: ^6.1.5
  flutter_markdown_plus: ^1.0.7
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.3.0
  http: ^1.5.0
  image: ^4.5.4
  uuid: ^4.5.1
  yaml: ^3.1.3
  xml: ^6.6.1
  highlight: ^0.7.0
  markdown: ^7.3.1
  flutter_widget_from_html_core: ^0.16.0
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  sqflite_common: ^2.5.7
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  pasteboard: ^0.5.0
  crypto: ^3.0.6
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1

  intl: any
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/prompts/
    - assets/prompts/_shared/
    - assets/prompts/common/
    - assets/prompts/default/
    - assets/prompts/harness_engineering/
    - assets/prompts/hermes_talker/
    - assets/prompts/machine_expert/
    - assets/prompts/programming_expert/
    - assets/prompts/programming_expert/sections/
    - assets/prompts/siri_helper/
    - assets/prompts/web_reverse_expert/
    - assets/prompts/web_reverse_expert/snippets/
    - assets/branding/
    - assets/web/
    - assets/web/chunks/
    - assets/web/assets/
    - assets/tooling/

# Use system SQLite on macOS (avoids downloading from GitHub).
hooks:
  user_defines:
    sqlite3:
      source: system
